services:
  rag-cli:
    build: .
    container_name: fym-rag-cli
    volumes:
      # Sincronización de código y datos en tiempo real
      - ./src:/app/src
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./.env:/app/.env
    environment:
      # Ruta puente para que LangChain encuentre a Ollama en macOS
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    # Estas dos opciones permiten dejar el contenedor corriendo y acceder a su terminal
    tty: true
    stdin_open: true
    # Le indica a Docker que levante Redis antes que tu API
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: fym-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data: